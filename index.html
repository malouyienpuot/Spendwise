<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpendWise</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container">
      <header class="header">
        <p class="eyebrow">Smart budgeting</p>
        <h1>SpendWise</h1>
      </header>

      <section class="card">
        <h2>Monthly Budget Planner</h2>

        <form id="budget-form">
          <div class="field-grid">
            <label>
              Monthly income
              <input id="income" type="number" min="0" step="0.01" value="4500" />
            </label>

            <label>
              Savings goal
              <input id="savingsGoal" type="number" min="0" step="0.01" value="600" />
            </label>
          </div>

          <div class="button-row">
            <button type="submit" class="primary">Calculate Budget</button>
            <button type="button" id="promptButton" class="secondary">Use Input Prompts</button>
            <button type="button" id="sampleButton" class="ghost">Load Example</button>
          </div>
        </form>
      </section>

      <section class="card secondary-card">
        <h3>Add Expense</h3>

        <form id="expense-form">
          <div class="field-grid compact">
            <label>
              Expense name
              <input id="expenseName" type="text" placeholder="e.g. Rent" />
            </label>

            <label>
              Expense amount
              <input id="expenseAmount" type="number" min="0" step="0.01" placeholder="0.00" />
            </label>
          </div>

          <div class="button-row">
            <button type="submit" class="primary small">Add Expense</button>
            <button type="button" id="clearExpenses" class="ghost">Clear List</button>
          </div>
        </form>

        <ul id="expenseList" class="expense-list" aria-live="polite"></ul>
      </section>

      <section class="results" aria-live="polite">
        <div class="result-box">
          <span>Total Expenses</span>
          <strong id="totalExpenses">$0.00</strong>
        </div>
        <div class="result-box">
          <span>Remaining Balance</span>
          <strong id="remainingBalance">$0.00</strong>
        </div>
        <div class="result-box">
          <span>Savings Rate</span>
          <strong id="savingsRate">0.00%</strong>
        </div>
      </section>

      <div id="statusMessage" class="status neutral">Budget status will appear here.</div>
    </main>
  </body>
</html>
