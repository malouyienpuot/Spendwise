<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpendWise</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container">
      <header class="header">
        <p class="eyebrow">Smart budgeting</p>
        <h1>SpendWise</h1>
      </header>

      <section class="card">
        <h2>Monthly Budget Planner</h2>

        <form id="budget-form">
          <div class="field-grid">
            <label>
              Monthly income
              <input id="income" type="number" min="0" step="0.01" value="4500" />
            </label>

            <label>
              Rent / Housing
              <input id="housing" type="number" min="0" step="0.01" value="1500" />
            </label>

            <label>
              Groceries
              <input id="groceries" type="number" min="0" step="0.01" value="500" />
            </label>

            <label>
              Utilities
              <input id="utilities" type="number" min="0" step="0.01" value="250" />
            </label>

            <label>
              Transportation
              <input id="transportation" type="number" min="0" step="0.01" value="220" />
            </label>

            <label>
              Other expenses
              <input id="otherExpenses" type="number" min="0" step="0.01" value="350" />
            </label>

            <label>
              Savings goal
              <input id="savingsGoal" type="number" min="0" step="0.01" value="600" />
            </label>
          </div>

          <div class="button-row">
            <button type="submit" class="primary">Calculate Budget</button>
            <button type="button" id="promptButton" class="secondary">Use Input Prompts</button>
            <button type="button" id="sampleButton" class="ghost">Load Example</button>
          </div>
        </form>
      </section>

      <section class="results" aria-live="polite">
        <div class="result-box">
          <span>Total Expenses</span>
          <strong id="totalExpenses">$0.00</strong>
        </div>
        <div class="result-box">
          <span>Remaining Balance</span>
          <strong id="remainingBalance">$0.00</strong>
        </div>
        <div class="result-box">
          <span>Savings Rate</span>
          <strong id="savingsRate">0.00%</strong>
        </div>
      </section>
    </main>
  </body>
</html>
